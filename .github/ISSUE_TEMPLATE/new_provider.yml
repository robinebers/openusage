name: New Provider Request
description: Request or propose a new AI provider
labels: ["provider"]
body:
  - type: markdown
    attributes:
      value: |
        Want to add a new AI provider to OpenUsage? Fill in the details below.
        You can submit just a request, or build the provider yourself and open a PR.
  - type: input
    id: provider_name
    attributes:
      label: Provider Name
      placeholder: "e.g. Gemini, Copilot, Perplexity"
    validations:
      required: true
  - type: input
    id: provider_url
    attributes:
      label: Provider Website
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: What usage data does this provider expose?
      description: Describe the usage metrics and limits the provider's API reports, and how a user signs in (OAuth, device code, API key). OpenUsage only shows what the API returns to a signed-in account; it does not scrape dashboards or read other tools' files. Name the auth method only — never paste real API keys, tokens, or cookie values.
      placeholder: |
        - Monthly request limit: 500
        - Accessible via: GET https://api.provider.com/v1/usage
        - Auth method: API key
    validations:
      required: true
  - type: dropdown
    id: will_build
    attributes:
      label: Will you build the provider?
      options:
        - "Yes, I will submit a PR"
        - "No, I am just requesting it"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Links to API docs, screenshots of the usage dashboard, or anything else that helps.
