name: CI

on:
  # The Swift edition ships from `main`. The frozen Tauri edition is preserved on `tauri-legacy`.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build and Test
    # Builds against the macOS 26 SDK with the package's macOS 15 deployment target (Package.swift
    # .macOS(.v15)), so this compiles the whole codebase — including the `if #available(macOS 26, *)`
    # Liquid Glass branches — for the macOS 15 floor. That is the floor's compile guarantee: a binary
    # built here reports minos 15.0. We do NOT add a macos-15 runner leg — back-deployment compiles
    # against the newest SDK, and a stock macos-15 runner ships Swift 6.1 without the macOS 26 SDK, so
    # it cannot build this package. Runtime verification on Sequoia is a manual smoke pass.
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # release.yml computes CFBundleVersion with script/build_number.sh on macOS (BSD awk, bash 3.2).
      - name: Test release build numbers
        run: |
          check() {
            git worktree add --quiet --detach "$RUNNER_TEMP/build-number" "$1"
            actual="$(cd "$RUNNER_TEMP/build-number" && "$GITHUB_WORKSPACE/script/build_number.sh" "$2")"
            git worktree remove --force "$RUNNER_TEMP/build-number"
            [ "$actual" = "$3" ] || { echo "build_number.sh $2 at $1 printed '$actual', expected $3" >&2; exit 1; }
          }
          check 35e88e93^ v0.8.0 887
          check 35e88e93 v0.8.0-beta.8 888
          check 35e88e93 v0.8.0 888.1

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      - name: Test development sample data
        run: swift test -Xswiftc -DOPENUSAGE_DEVELOPMENT --filter 'DevelopmentDemoTests|DevelopmentDataModeTests'

      - name: Verify production excludes development sample data
        run: |
          production_scratch="$RUNNER_TEMP/openusage-production"
          swift build -c release --scratch-path "$production_scratch" --product OpenUsage
          swift build -c release --scratch-path "$production_scratch" --product openusage-cli
          production_bin="$(swift build -c release --scratch-path "$production_scratch" --show-bin-path)"
          ./script/verify_no_demo.sh "$production_bin/OpenUsage" "$production_bin/openusage-cli"
